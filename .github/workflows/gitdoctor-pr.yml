name: gitdoctor-pr

# PR gate, dogfooding our own composite action (./action.yml): scan on every
# PR, one self-updating comment, criticals fail the check.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags

      - uses: ./
