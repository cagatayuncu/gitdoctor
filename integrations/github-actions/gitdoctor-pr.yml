name: gitdoctor-pr

# Copy this file into YOUR repo as .github/workflows/gitdoctor-pr.yml.
# Every PR gets one self-updating comment with the findings and fix commands;
# critical findings turn the check red (mark the job "required" in branch
# protection to block the merge button).
#
# Pin to a release tag. Inputs (all optional): checks, skip, min-severity,
# comment, fail-on, github-token — see the action's README section.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: ancestry checks degrade on shallow clones

      - name: Fetch all branches and tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags

      - uses: cagatayuncu/gitdoctor@v0.2.1
