# gitdoctor on GitLab merge requests — DRAFT (not yet exercised on a live
# GitLab instance; the doctor itself is platform-neutral, this wiring is not).
#
# Merge this job into your .gitlab-ci.yml. Posting the MR note needs a token
# with `api` scope in GITDOCTOR_GITLAB_TOKEN (masked CI/CD variable); without
# it the job still gates on exit code and the report stays in the job log.
gitdoctor:
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache bash git curl jq
    - git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
    - git clone --depth 1 https://github.com/cagatayuncu/gitdoctor /tmp/gitdoctor
  script:
    - set +e
    - bash /tmp/gitdoctor/scripts/gitflow-doctor.sh --format json --no-fetch --skip detached-head > report.json
    - status=$?
    - set -e
    - jq . report.json
    - |
      if [ -n "${GITDOCTOR_GITLAB_TOKEN:-}" ]; then
        crit=$(jq -r '.summary.critical' report.json)
        warn=$(jq -r '.summary.warning' report.json)
        body="gitdoctor: ${crit} critical, ${warn} warning(s).$(jq -r '.findings[] | select(.status=="fail") | "\n- [" + .severity + "] " + .id + ": " + .title' report.json)"
        curl -sS --request POST \
          --header "PRIVATE-TOKEN: $GITDOCTOR_GITLAB_TOKEN" \
          --data-urlencode "body=$body" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" >/dev/null
      fi
    - test "$status" -lt 2
